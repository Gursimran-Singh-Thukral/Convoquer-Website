<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="40%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997314"/>
    </linearGradient>
    <pattern id="cardPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Body -->
  <rect x="10" y="10" width="780" height="480" rx="24" fill="url(#cardBg)" stroke="rgba(212,175,55,0.4)" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="480" rx="24" fill="url(#cardPattern)"/>

  <!-- Top Header Ribbon -->
  <path d="M 10 34 Q 10 10 34 10 L 766 10 Q 790 10 790 34 L 790 90 L 10 90 Z" fill="#701A2B"/>
  <rect x="10" y="88" width="780" height="4" fill="url(#goldAccent)"/>

  <!-- Institute Branding -->
  <circle cx="56" cy="50" r="26" fill="#18161B" stroke="url(#goldAccent)" stroke-width="1.5"/>
  <text x="56" y="56" fill="#FFDF73" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">IIT</text>

  <text x="96" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="19" font-weight="800" letter-spacing="1">INDIAN INSTITUTE OF TECHNOLOGY JAMMU</text>
  <text x="96" y="66" fill="#FFDF73" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="2">GOVERNMENT OF INDIA • VALID STUDENT/VISITOR ACCREDITATION</text>

  <!-- Chip Graphic -->
  <rect x="50" y="130" width="75" height="55" rx="8" fill="url(#chipGrad)" stroke="#664400" stroke-width="1"/>
  <line x1="50" y1="157" x2="125" y2="157" stroke="#664400" stroke-width="1"/>
  <line x1="87" y1="130" x2="87" y2="185" stroke="#664400" stroke-width="1"/>
  <rect x="68" y="142" width="38" height="30" rx="4" fill="none" stroke="#664400" stroke-width="1"/>

  <!-- Photo Box -->
  <rect x="50" y="210" width="160" height="200" rx="12" fill="#0A0C10" stroke="url(#goldAccent)" stroke-width="2"/>
  <circle cx="130" cy="275" r="42" fill="#252D3D"/>
  <path d="M 80 395 C 80 335, 180 335, 180 395 Z" fill="#252D3D"/>
  <text x="130" y="405" fill="#8899B0" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">PHOTO ID</text>

  <!-- Card Details -->
  <text x="245" y="145" fill="#8899B0" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FULL NAME / HOLDER</text>
  <text x="245" y="175" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">RAHUL SHARMA</text>

  <text x="245" y="220" fill="#8899B0" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AFFILIATION / INSTITUTION</text>
  <text x="245" y="245" fill="#FFDF73" font-family="sans-serif" font-size="16" font-weight="700">Indian Institute of Technology Jammu</text>

  <text x="245" y="290" fill="#8899B0" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ROLL / IDENTITY NUMBER</text>
  <text x="245" y="315" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="700">2023CSB101 / CQ26-AUD</text>

  <text x="245" y="360" fill="#8899B0" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SECURITY STATUS</text>
  <rect x="245" y="372" width="140" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="315" y="389" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERIFIED AUTHENTIC</text>

  <!-- Barcode / Hologram at Right -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="130" height="130" rx="10" fill="#0A0D14" stroke="rgba(255,255,255,0.1)"/>
    <!-- Mock QR Code -->
    <rect x="15" y="15" width="30" height="30" fill="#FFDF73"/>
    <rect x="20" y="20" width="20" height="20" fill="#0A0D14"/>
    <rect x="85" y="15" width="30" height="30" fill="#FFDF73"/>
    <rect x="90" y="20" width="20" height="20" fill="#0A0D14"/>
    <rect x="15" y="85" width="30" height="30" fill="#FFDF73"/>
    <rect x="20" y="90" width="20" height="20" fill="#0A0D14"/>
    <rect x="55" y="25" width="15" height="15" fill="#FFFFFF"/>
    <rect x="55" y="55" width="20" height="20" fill="#FFDF73"/>
    <rect x="25" y="55" width="15" height="15" fill="#FFFFFF"/>
    <rect x="85" y="60" width="15" height="25" fill="#FFFFFF"/>
    <rect x="55" y="85" width="25" height="15" fill="#FFDF73"/>
    <rect x="95" y="95" width="20" height="20" fill="#FFFFFF"/>
    <text x="65" y="148" fill="#8899B0" font-family="monospace" font-size="10" text-anchor="middle">SECURE ID-QR</text>
  </g>

  <!-- Hologram Seal -->
  <circle cx="685" cy="350" r="45" fill="none" stroke="url(#goldAccent)" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="685" cy="350" r="38" fill="rgba(212,175,55,0.08)"/>
  <text x="685" y="347" fill="#FFDF73" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">CONVOQUER'26</text>
  <text x="685" y="360" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">SECURITY SEAL</text>

  <!-- Card Bottom Strip -->
  <line x1="50" y1="440" x2="750" y2="440" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="50" y="465" fill="#606E80" font-family="monospace" font-size="11">ID: 8849-2026-IITJ-PASS // PROPERTY OF IIT JAMMU // NON-TRANSFERABLE</text>
</svg>
